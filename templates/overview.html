<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ category.capitalize() }} Solutions</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white font-sans">
  <div class="max-w-6xl mx-auto py-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6">
      <h1 class="text-3xl font-bold text-gray-800">{{ category.capitalize() }} Storage Solutions</h1>
      <div class="flex flex-wrap justify-end items-center gap-2 w-full md:w-auto">
        <a href="/" class="bg-yellow-400 hover:bg-yellow-300 text-black font-semibold py-2 px-4 rounded">🏠 Home</a>
        <a href="/wizard" class="bg-yellow-400 hover:bg-yellow-300 text-black font-semibold py-2 px-4 rounded">🧭 Wizard</a>
        <a href="/about" class="bg-yellow-400 hover:bg-yellow-300 text-black font-semibold py-2 px-4 rounded">ℹ️ About Us</a>
        <a href="https://survey.uu.nl/jfe/form/SV_eJXjVQFcv3znem2" target="_blank" rel="noopener noreferrer"
           class="bg-yellow-400 hover:bg-yellow-300 text-black font-semibold py-2 px-4 rounded"
           title="Help us improve this tool by completing a short feedback survey.">📝 Feedback</a>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for sol in solutions %}
      <div class="border p-4 rounded-lg shadow hover:shadow-md">
        <h2 class="text-xl font-semibold mb-2">{{ sol.name }}</h2>
        <p class="text-gray-600 text-sm mb-3">{{ sol['Purpose'][:120] }}...</p>
        <a href="/solution/{{ sol.name }}" class="text-blue-600 hover:underline text-sm">View details →</a>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
