<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storage Wizard</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f7f7f7;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0;
    }

    .btn-compare {
      padding: 0.5rem 1rem;
      background: #ffc904;
      color: black;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-compare.active {
      opacity: 1;
      pointer-events: auto;
    }

    .layout {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .form-area {
      flex: 1;
      min-width: 300px;
    }

    .results-area {
      flex: 1.2;
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.05);
    }

    .step {
      margin-bottom: 2rem;
    }

    .step label {
      display: block;
      margin: 0.5rem 0;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: #ffc904;
      color: black;
      border-radius: 4px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .card {
      background: #fdfdfd;
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
    }

    .card.disabled {
      opacity: 0.6;
      filter: grayscale(60%);
    }

    .card h4 {
      margin-top: 0;
    }

    .btn-small {
      margin-top: auto;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      background: #ffc904;
      color: black;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      width: fit-content;
    }

    .reasons {
      background: #f0f0f0;
      margin-top: 0.5rem;
      padding: 0.5rem;
      border-left: 3px solid #d33;
      font-size: 0.85rem;
    }

    .reasons ul {
      padding-left: 1.2rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🧭 Storage Solution Wizard</h1>
    <a id="compare-btn" class="btn-compare" href="#">🧪 Compare Selected</a>
  </div>

  <div class="layout">
    <div class="form-area">
      <form method="get" action="/wizard/results" id="wizard-form">
        <div class="step">
          <h3>1. What phase are you in?</h3>
          <label><input type="radio" name="phase" value="active" required> During research (active)</label>
          <label><input type="radio" name="phase" value="preservation"> After research (archiving/publishing)</label>
        </div>
        <div class="step">
          <h3>2. Does the data contain sensitive/personal info?</h3>
          <label><input type="radio" name="sensitive" value="yes" required> Yes</label>
          <label><input type="radio" name="sensitive" value="no"> No</label>
        </div>
        <div class="step">
          <h3>3. Do you want to collaborate?</h3>
          <label><input type="radio" name="collab" value="internal" required> Yes, inside UU</label>
          <label><input type="radio" name="collab" value="external"> Yes, with external partners</label>
          <label><input type="radio" name="collab" value="no"> No collaboration needed</label>
        </div>
        <div class="step">
          <h3>4. How much data are you storing?</h3>
          <label><input type="radio" name="volume" value="small" required> Small (&lt; 50 GB)</label>
          <label><input type="radio" name="volume" value="medium"> Medium (50 GB – 1 TB)</label>
          <label><input type="radio" name="volume" value="large"> Large (&gt; 1 TB)</label>
        </div>
        <div class="step">
          <button class="btn" type="submit">🔍 Show Full Results</button>
        </div>
      </form>
    </div>

    <div class="results-area">
      <h2>🔎 Matching Solutions</h2>
      <div id="matches" class="grid">
        <p>Start selecting options to see matching solutions here...</p>
      </div>

      <h2 style="margin-top:2rem;">⚠️ Not Matching </h2>
      <div id="non-matches" class="grid"></div>
    </div>
  </div>

  <script>
    let selected = [];

    function toggleSelect(name) {
      const idx = selected.indexOf(name);
      if (idx === -1) selected.push(name);
      else selected.splice(idx, 1);
      updateCompareBtn();
    }

    function updateCompareBtn() {
      const btn = document.getElementById("compare-btn");
      if (selected.length >= 2) {
        btn.classList.add("active");
        btn.href = "/compare?" + selected.map(n => "names=" + encodeURIComponent(n)).join("&");
      } else {
        btn.classList.remove("active");
        btn.href = "#";
      }
    }

    function updateMatches() {
      const form = document.querySelector("form");
      const data = new FormData(form);
      const payload = {};
      for (let [k,v] of data.entries()) payload[k] = v;

      fetch("/api/filter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("matches");
        const nonContainer = document.getElementById("non-matches");
        container.innerHTML = "";
        nonContainer.innerHTML = "";
        selected = [];

        if (!data.matches.length && !data.non_matches.length) {
          container.innerHTML = "<p>No matches yet. Try selecting more options.</p>";
          updateCompareBtn();
          return;
        }

        data.matches.forEach(s => {
          selected.push(s.name);
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <h4>${s.name}</h4>
            <p>${(s.Purpose || "No description").slice(0,150)}...</p>
            <label>
              <input type="checkbox" class="compare-toggle" checked onchange="toggleSelect('${s.name}')">
              Select for comparison
            </label>
            <a class="btn-small" href="/solution/${encodeURIComponent(s.name)}">🔍 View Details</a>
          `;
          container.appendChild(div);
        });

        data.non_matches.forEach(s => {
          const div = document.createElement("div");
          div.className = "card disabled";
          div.innerHTML = `
            <h4>${s.name}</h4>
            <p>${(s.Purpose || "No description").slice(0,150)}...</p>
            <div class="reasons">
              <strong>Not suitable because:</strong>
              <ul>${(s.reasons || []).map(r => `<li>${r}</li>`).join("")}</ul>
            </div>
          `;
          nonContainer.appendChild(div);
        });

        updateCompareBtn();
      });
    }

    document.querySelectorAll("input[type=radio]").forEach(el => {
      el.addEventListener("change", updateMatches);
    });
  </script>
</body>
</html>
